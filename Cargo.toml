[workspace]
resolver = "2"
members = [
    "crates/drill-core",
    "crates/drill-locker",
    "crates/drill-restorer",
    "crates/drill-webgen",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
image = "0.25"
ab_glyph = "0.2"
imageproc = "0.27"
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
drill-core = { path = "crates/drill-core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
