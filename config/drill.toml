# ==============================================================================
#  勒索病毒应急演练套件 —— 唯一配置源
# ==============================================================================
#  本文件是整套演示工具的「换皮入口」。
#  配置在编译期被嵌入二进制，因此修改后需要【重新编译】才会生效：
#
#      cargo run -p xtask -- package
#
#  该命令会重新编译 drill-locker / drill-restorer，渲染 index.html 与壁纸，
#  并把全部产物组装到 dist/ 目录。
#
#  给不同单位做演练时，只需修改下方 [organization] 与相关文案，重新打包即可。
# ==============================================================================

[organization]
# 【必改】单位全称。会出现在弹窗正文、壁纸、下载页中。
name = "XXX公司"
# 单位简称，用于空间较小的位置。
short_name = "XXX"
# 演练编号，用于演练记录归档，如「2026-XX银行-001」。
drill_code = "2026-XXX-001"


# ------------------------------------------------------------------------------
# 文件锁定行为
# ------------------------------------------------------------------------------
[lock]
# 伪加密后缀。锁定 = 在原文件名后追加此后缀，【不会修改文件内容】。
extension = ".drill_locked"

# 是否递归处理子目录。
recursive = true

# 安全上限：待锁定文件数超过该值时中止，防止误伤大范围目录。
max_files = 50000

# 遍历时跳过的目录名 / 文件名。
exclude = [
    ".git",
    "target",
    "node_modules",
    ".svn",
    ".DS_Store",
    "Thumbs.db",
    "manifest.json",
]


# ------------------------------------------------------------------------------
# 桌面壁纸
# ------------------------------------------------------------------------------
[wallpaper]
# 生成壁纸的分辨率。建议不低于演练机器分辨率。
width = 2560
height = 1600

# 纯黑背景
background = "#000000"
# 主标题（大号红字）
title = "您的文件已被加密"
# 副标题，支持 {org} {short_name} 占位符；用 \n 换行
subtitle = "{org}\n重要数据已被锁定\n请立即联系信息中心"
# 主标题颜色
accent = "#FF0000"
# 副标题颜色
subtitle_color = "#CC0000"

# 字体文件路径。留空则自动探测系统字体（见 README）。
font_path = ""

# 【合规选项】填入文字后，会在壁纸右下角以不显眼的小字显示。
# 例如填「应急演练」。留空 = 纯拟真，无任何演练标识。
drill_notice = ""


# ------------------------------------------------------------------------------
# 勒索弹窗
# ------------------------------------------------------------------------------
[popup]
# 窗口标题栏文字
title = "Wana Decrypt0r 2.0"
# 窗口内大标题
headline = "您的文件已被加密！"

# 假联系邮箱（不会真的发信，程序不联网）
email = "decrypt@drill-example.com"
# 假比特币地址（参考图中的示例地址，非真实收款地址）
bitcoin = "12t9YDPgwueZ9NyMgw519p7AA8isjr6SMw"
# 假赎金金额
amount = "$300"

# 两个倒计时：赎金翻倍时限 / 文件销毁时限（单位：小时）
pay_raise_hours = 72
files_lost_hours = 168

# 正文。支持 {org} {short_name} {email} {amount} {bitcoin}
# {pay_raise_hours} {files_lost_hours} 占位符。空行分段。
body = """
我的电脑出了什么问题？
您的一些重要文件被我加密保存了。照片、图片、文档、压缩包、音频、视频文件等，几乎所有类型的文件都被加密了，因此不能正常打开。这和一般文件损坏有本质上的区别——您大可在网上找找恢复文件的方法，我敢保证，没有我们的解密服务，就算老天爷来了也不能恢复这些文档。

有没有恢复这些文档的方法？
当然有可恢复的方法，只能通过我们的解密服务才能恢复。我以人格担保，能够提供安全有效的恢复服务。但这是收费的，也不能无限期地推迟。请点击 <Decrypt> 按钮，就可以免费恢复一些文档，请您放心，我是绝不会骗你的。但想要恢复全部文档，需要支付一定费用。

我需要做什么？
您需要在 {pay_raise_hours} 小时之内，支付 {amount} 等值的比特币到下面的地址。付款越晚越不利，超过 {pay_raise_hours} 小时费用将会翻倍；超过 {files_lost_hours} 小时仍未付款，密钥将被永久销毁，届时任何人都无法恢复您的文件。付款后请点击 Check Payment 按钮进行验证。

如何联系你们？
您可以通过邮件 {email} 与我们联系，我们会在 24 小时内回复。请在邮件中附上您的个人识别码，以便我们为您提供解密服务。
"""

# 是否在正文末尾追加演练声明。建议保持开启，避免参演人员误解为真实攻击。
show_drill_disclaimer = true
disclaimer = "【应急演练】本页面为 {org} 网络安全应急演练的演示环境，不涉及任何真实数据，不会造成任何实际损失，请勿惊慌。"


# ------------------------------------------------------------------------------
# 勒索信
# ------------------------------------------------------------------------------
# 在每个被锁定的目录里投放一份说明文件。这是勒索软件的标志性特征，
# 也是演练中参演人员最直接的「发现点」——真实事件里，很多人正是先看到
# 文件夹里多出来的这个文件才意识到中招。
[ransom_note]
enabled = true
# 勒索信文件名（会出现在每个被锁目录里）
filename = "如何恢复你的文件.txt"
# 「个人识别码」前缀，用于演练复盘时对位到具体目录
id_prefix = "WNCRY"
# 正文；留空则复用上面 [popup] 的 body
body = ""


# ------------------------------------------------------------------------------
# 钓鱼下载页（index.html）
# ------------------------------------------------------------------------------
[web]
# 仿冒的浏览器主页标题
site_title = "新标签页"
# 快捷方式里那个「工具」的名字
download_name = "系统优化工具"
# 下载页上的软件版本号与文件大小（纯装饰，需与真实产物大致相符）
download_version = "v3.2.1"
download_size = "8.4 MB"
# 假下载量
download_count = "1,284,937"

# 搜索结果页里「广告位」链接展示的仿冒域名（纯展示，页面不联网、不会真的访问）。
# 演练时可以把它设成与目标软件官网相似的拼写错误域名，更贴近真实钓鱼场景。
fake_domain = "downlod-center.com"
