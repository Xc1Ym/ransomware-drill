# ==============================================================================
#  勒索病毒应急演练套件 —— 唯一配置源
# ==============================================================================
#  演练素材里所有可按单位、按场景调整的内容都集中在这里。
#  改完后重新打包即可生效：
#
#      cargo run -p xtask -- package
#
#  【可用的占位符】写文案时可以直接引用，打包时会被替换：
#      {org}             单位全称          {short_name}      单位简称
#      {drill_code}      演练编号          {domain}          内部域名
#      {external_domain} 外部域名          {download_name}   软件名
#      {amount} {bitcoin} {email}          赎金金额 / 地址 / 邮箱
#
#  【关于长度】有些文案用三引号写成多行（例如弹窗正文、邮件正文），
#  空行分段、换行会原样保留，直接写就行。
# ==============================================================================


# ------------------------------------------------------------------------------
# 单位信息
# ------------------------------------------------------------------------------
[organization]
# 【必改】单位全称。会出现在弹窗、壁纸、页面标题等各处。
name = "XXX公司"
# 单位简称，用在空间较小的地方（如页面上的圆形标识）。
short_name = "XXX"
# 演练编号，用于演练记录归档，例如「2026-XX银行-001」。
drill_code = "2026-XXX-001"


# ------------------------------------------------------------------------------
# 域名与身份
# ------------------------------------------------------------------------------
# 演练素材里的邮箱地址、示例网址都由这两个域名派生。
# 改这两处，邮件列表、搜索结果、示例链接里的地址会一起跟着变，
# 不用逐个去改。文案里写 {domain} / {external_domain} 即可引用。
[identity]
# 内部域名：内部同事的邮箱后缀、内网示例网址用它
domain = "example.com"
# 外部域名：钓鱼邮件的发件人用它，伪装成外部机构。与内部域名不同更贴近真实。
external_domain = "example-corp.com"


# ------------------------------------------------------------------------------
# 文件锁定行为
# ------------------------------------------------------------------------------
[lock]
# 伪加密后缀。锁定 = 在原文件名后追加此后缀，【不会修改文件内容】。
extension = ".drill_locked"

# 是否递归处理子目录。
recursive = true

# 安全上限：待锁定文件数超过该值时中止，防止误伤大范围目录。
max_files = 50000

# 遍历时跳过的目录名 / 文件名。
exclude = [
    ".git",
    "target",
    "node_modules",
    ".svn",
    ".DS_Store",
    "Thumbs.db",
    "manifest.json",
]


# ------------------------------------------------------------------------------
# 桌面壁纸
# ------------------------------------------------------------------------------
[wallpaper]
# 生成壁纸的分辨率。建议不低于演练机器分辨率。
width = 2560
height = 1600

# 背景色（纯黑）
background = "#000000"
# 主标题（大号红字）
title = "您的文件已被加密"
# 副标题，用 \n 换行
subtitle = "{org}\n重要数据已被锁定\n请立即联系信息中心"
# 主标题颜色 / 副标题颜色
accent = "#FF0000"
subtitle_color = "#CC0000"

# 字体文件路径。留空则自动探测系统中文字体。
font_path = ""

# 【合规选项】填入文字后会在壁纸右下角以不显眼的小字显示，
# 例如填「应急演练」。留空 = 纯拟真，无任何演练标识。
drill_notice = ""


# ------------------------------------------------------------------------------
# 勒索弹窗
# ------------------------------------------------------------------------------
[popup]
# 窗口标题栏文字 / 窗口内大标题
title = "Wana Decrypt0r 2.0"
headline = "您的文件已被加密！"

# 假联系邮箱（程序不联网，不会真的发信）
email = "decrypt@{external_domain}"
# 假比特币地址（示例地址，非真实收款地址）
bitcoin = "12t9YDPgwueZ9NyMgw519p7AA8isjr6SMw"
# 假赎金金额
amount = "$300"

# 两个倒计时：赎金翻倍时限 / 文件销毁时限（单位：小时）
pay_raise_hours = 72
files_lost_hours = 168

# 弹窗正文与勒索信共用的正文。空行分段。
body = """
我的电脑出了什么问题？
您的一些重要文件被我加密保存了。照片、图片、文档、压缩包、音频、视频文件等，几乎所有类型的文件都被加密了，因此不能正常打开。这和一般文件损坏有本质上的区别——您大可在网上找找恢复文件的方法，我敢保证，没有我们的解密服务，就算老天爷来了也不能恢复这些文档。

有没有恢复这些文档的方法？
当然有可恢复的方法，只能通过我们的解密服务才能恢复。我以人格担保，能够提供安全有效的恢复服务。但这是收费的，也不能无限期地推迟。请点击 <Decrypt> 按钮，就可以免费恢复一些文档，请您放心，我是绝不会骗你的。但想要恢复全部文档，需要支付一定费用。

我需要做什么？
您需要在 {pay_raise_hours} 小时之内，支付 {amount} 等值的比特币到下面的地址。付款越晚越不利，超过 {pay_raise_hours} 小时费用将会翻倍；超过 {files_lost_hours} 小时仍未付款，密钥将被永久销毁，届时任何人都无法恢复您的文件。付款后请点击 Check Payment 按钮进行验证。

如何联系你们？
您可以通过邮件 {email} 与我们联系，我们会在 24 小时内回复。请在邮件中附上您的个人识别码，以便我们为您提供解密服务。
"""

# 是否在正文末尾追加演练声明。建议保持开启，避免参演人员误解为真实攻击。
show_drill_disclaimer = true
disclaimer = "【应急演练】本页面为 {org} 网络安全应急演练的演示环境，不涉及任何真实数据，不会造成任何实际损失，请勿惊慌。"


# ------------------------------------------------------------------------------
# 勒索信（投放在每个被锁目录里）
# ------------------------------------------------------------------------------
# 这是勒索软件的标志性特征，也是演练中参演人员最直接的「发现点」。
[ransom_note]
enabled = true
# 勒索信文件名
filename = "如何恢复你的文件.txt"
# 「个人识别码」前缀，用于复盘时对位到具体目录
id_prefix = "WNCRY"
# 正文；留空则复用上面 [popup] 的 body
body = ""


# ------------------------------------------------------------------------------
# 演练入口页（index.html）
# ------------------------------------------------------------------------------
[portal]
# 主页大标题
title = "{org}勒索病毒应急演练"
subtitle = "请选择演练场景"
# 两个场景卡片的标题与说明
card_download_title = "文件下载勒索"
card_download_desc = "模拟员工在搜索结果里点进仿冒下载站，下载并运行看似正常的软件，实际中招。"
card_mail_title = "邮件勒索"
card_mail_desc = "模拟员工收到一封伪装成人事通知的钓鱼邮件，点开附件后中招。"

# 主页底部的恢复工具下载区。
# 演练结束后用它把文件名与桌面壁纸还原回去。这一区块刻意与上面的场景卡片
# 在视觉上区分开，避免参演人员把它当成攻击链路的一部分。
recovery_title = "演练恢复工具"
recovery_desc = "演练结束后运行本工具，即可把被改名的文件与桌面壁纸完整还原。"
recovery_button = "下载恢复工具"


# ==============================================================================
#  场景一：文件下载勒索
# ==============================================================================

# ------------------------------------------------------------------------------
# 仿浏览器新标签页（browser.html）
# ------------------------------------------------------------------------------
[browser]
# 标签页标题
tab_title = "新标签页"
# 地址栏里显示的网址
address = "https://www.{domain}/"
# 搜索框提示语
search_placeholder = "搜索或输入网址"
# 中间圆形标识里的文字，留空则用单位简称
logo_text = ""

# 快捷方式磁贴。第一个是「陷阱入口」，点击后进入仿搜索结果页；
# 其余是占据版面的装饰磁贴，link 留空即不可点击。
# 可选图标：download mail calendar doc cloud grid approve shield settings folder chart
[[browser.shortcut]]
name = "{download_name}"
icon = "download"
color = "#1a73e8"
link = "search.html?q={download_name}"
highlight = true

[[browser.shortcut]]
name = "邮箱"
icon = "mail"
color = "#ea4335"

[[browser.shortcut]]
name = "日历"
icon = "calendar"
color = "#34a853"

[[browser.shortcut]]
name = "文档"
icon = "doc"
color = "#1a73e8"

[[browser.shortcut]]
name = "网盘"
icon = "cloud"
color = "#f9ab00"

[[browser.shortcut]]
name = "工作台"
icon = "grid"
color = "#9334e6"

[[browser.shortcut]]
name = "审批"
icon = "approve"
color = "#12b5cb"

[[browser.shortcut]]
name = "安全中心"
icon = "shield"
color = "#5f6368"

[[browser.shortcut]]
name = "设置"
icon = "settings"
color = "#5f6368"

[[browser.shortcut]]
name = "添加快捷方式"
icon = "add"
color = "#5f6368"
dashed = true


# ------------------------------------------------------------------------------
# 仿搜索结果页（search.html）
# ------------------------------------------------------------------------------
[search]
# 页面左上角的品牌名
brand = "搜索"
# 搜索框为空时的兜底关键词
