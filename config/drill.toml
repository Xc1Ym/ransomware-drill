    "软件 官方下载",
    "下载站 推荐",
    "安装包 打不开 解决",
    "如何辨别 仿冒网站",
]

# 搜索结果里的装饰条目（置顶的「广告」陷阱条目由程序按关键词生成，不在此列）。
# favicon 是左侧圆圈里的那个字。
[[search.result]]
favicon = "百"
site = "百科"
url = "baike.{domain} › item › 下载"
title = "下载_百度百科"
snippet = "下载（Download）是指将文件从远程服务器传输到本地设备的过程。在下载软件时应当优先选择官方网站，注意核对域名，避免从来源不明的第三方站点获取安装包……"

[[search.result]]
favicon = "安"
site = "安全中心"
url = "security.{domain} › guide › safe-download"
title = "如何安全地下载软件？这份指南请收好 - 安全中心"
snippet = "一、认准官方域名；二、警惕搜索结果中的广告位链接；三、留意安装包的体积与数字签名；四、安装前用安全软件扫描。近年来，通过仿冒下载站投递勒索软件已成为常见的攻击手法……"

[[search.result]]
favicon = "知"
site = "知识库"
url = "wiki.{domain} › 教程"
title = "软件下载与安装常见问题汇总"
