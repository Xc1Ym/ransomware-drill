<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{BROWSER_TAB_TITLE}}</title>
<style>
  /* ============================================================
     仿浏览器新标签页 —— 应急演练演示用
     模板里的双花括号占位符由 drill-webgen 在打包时按 config/drill.toml 替换
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
                 "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #dee1e6;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    color: #202124;
  }

  /* ---------- 模拟浏览器外壳 ---------- */
  .browser-chrome {
    background: #dee1e6;
    padding: 8px 8px 0;
    user-select: none;
  }

  .tabstrip {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    padding: 0 4px;
    height: 34px;
  }

  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border-radius: 8px 8px 0 0;
    padding: 7px 12px 8px;
    min-width: 190px;
    max-width: 240px;
    font-size: 12px;
    color: #202124;
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }

  .tab .favicon {
    width: 14px; height: 14px;
    border-radius: 50%;
    flex: 0 0 auto;
    background: conic-gradient(#ea4335 0deg 130deg, #fbbc05 130deg 220deg, #34a853 220deg 360deg);
  }

  .tab .tab-title {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tab .tab-close {
    width: 16px; height: 16px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #5f6368;
    font-size: 14px;
    line-height: 1;
  }
  .tab .tab-close:hover { background: #e8eaed; }

  .newtab-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #5f6368;
    font-size: 18px;
    margin-bottom: 3px;
  }
  .newtab-btn:hover { background: #d3d7dc; }

  .tabstrip-spacer { flex: 1; }

  .window-controls { display: flex; gap: 2px; padding-bottom: 6px; }
  .window-controls span {
    width: 44px; height: 30px;
    display: grid; place-items: center;
    color: #5f6368; font-size: 12px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #fff;
    border-radius: 8px 8px 0 0;
    padding: 6px 10px;
  }

  .nav-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: #5f6368;
    flex: 0 0 auto;
  }
  .nav-btn:hover { background: #f1f3f4; }
  .nav-btn svg { width: 18px; height: 18px; fill: currentColor; }

  .omnibox {
    flex: 1;
    height: 34px;
    background: #f1f3f4;
    border-radius: 17px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 8px 0 14px;
    font-size: 13px;
    color: #202124;
  }
  .omnibox .lock { color: #5f6368; font-size: 12px; }
  .omnibox .url { flex: 1; }
  .omnibox .url .dim { color: #5f6368; }
  .omnibox .star, .omnibox .menu-dots { color: #5f6368; font-size: 15px; }

  /* ---------- 新标签页内容 ---------- */
  .page {
    flex: 1;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
  }

  .content {
    width: 100%;
    max-width: 720px;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo {
    margin-top: 84px;
    width: 96px; height: 96px;
    border-radius: 50%;
    background: conic-gradient(#ea4335 0deg 130deg, #fbbc05 130deg 220deg, #34a853 220deg 360deg);
    display: grid;
    place-items: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
  }
  .logo .inner {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: #fff;
    display: grid;
    place-items: center;
    font-size: 15px;
    font-weight: 700;
    color: #1a73e8;
    letter-spacing: .5px;
  }

  .searchbox {
    margin-top: 32px;
    width: 100%;
    max-width: 584px;
    height: 46px;
    border: 1px solid #dfe1e5;
    border-radius: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    font-size: 15px;
    color: #5f6368;
    box-shadow: 0 1px 6px rgba(32,33,36,.06);
    background: #fff;
  }
  .searchbox:hover { box-shadow: 0 1px 10px rgba(32,33,36,.16); }
  .searchbox input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    color: #202124;
    background: transparent;
    font-family: inherit;
  }
  .searchbox .icon { width: 20px; height: 20px; fill: #9aa0a6; flex: 0 0 auto; }

  .shortcuts {
    margin-top: 40px;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px 4px;
    padding-bottom: 48px;
  }

  .shortcut {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 4px;
    border-radius: 8px;
    text-decoration: none;
    color: #202124;
    transition: background .12s;
  }
  .shortcut:hover { background: #f1f3f4; }

  .shortcut .tile {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 20px;
    background: #f1f3f4;
    overflow: hidden;
  }
  .shortcut .tile svg { width: 24px; height: 24px; }

  .shortcut .label {
    font-size: 12px;
    color: #202124;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  /* 主推的「下载」快捷方式做得更醒目一点 */
  .shortcut.primary .tile {
    background: linear-gradient(135deg, #1a73e8, #4b8ef7);
    color: #fff;
    box-shadow: 0 3px 8px rgba(26,115,232,.35);
  }
  .shortcut.primary .label { font-weight: 600; }

  .add-shortcut .tile { background: #f1f3f4; color: #5f6368; font-size: 22px; }

  .footer-note {
    margin-top: auto;
    padding: 20px 0 28px;
    font-size: 11px;
    color: #9aa0a6;
    text-align: center;
  }
</style>
</head>
<body>

<!-- ============ 模拟浏览器外壳 ============ -->
<div class="browser-chrome">
  <div class="tabstrip">
    <div class="tab">
      <div class="favicon"></div>
      <div class="tab-title">{{BROWSER_TAB_TITLE}}</div>
      <div class="tab-close">×</div>
    </div>
    <div class="newtab-btn">+</div>
    <div class="tabstrip-spacer"></div>
    <div class="window-controls">
      <span>─</span><span>□</span><span>✕</span>
    </div>
  </div>

  <div class="toolbar">
    <div class="nav-btn" title="后退">
      <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg>
    </div>
    <div class="nav-btn" title="前进">
      <svg viewBox="0 0 24 24"><path d="M8.6 7.4 10 6l6 6-6 6-1.4-1.4L13.2 12z"/></svg>
    </div>
    <div class="nav-btn" title="刷新">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6a5.94 5.94 0 0 1 4.22 1.78L13 11h7V4z"/></svg>
    </div>
    <div class="omnibox">
      <span class="lock">🔒</span>
      <span class="url">{{BROWSER_ADDRESS}}</span>
      <span class="star">☆</span>
      <span class="menu-dots">⋮</span>
    </div>
  </div>
</div>

<!-- ============ 新标签页内容 ============ -->
<div class="page">
  <div class="content">
    <div class="logo">
      <div class="inner">{{BROWSER_LOGO_TEXT}}</div>
    </div>

    <form class="searchbox" id="searchForm" autocomplete="off">
      <svg class="icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input type="text" id="q" placeholder="{{BROWSER_SEARCH_PH}}" spellcheck="false">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
    </form>

    <!-- 磁贴按 config/drill.toml 的 [[browser.shortcut]] 渲染，增删条目无需改这里 -->
    <div class="shortcuts" id="shortcuts"></div>
  </div>

  <div class="footer-note">
    应急演练演示环境 · {{ORG}} · 演练编号 {{DRILL_CODE}}
  </div>
</div>

<script>
  // ---------- 快捷方式磁贴：完全按 config/drill.toml 的 [[browser.shortcut]] 渲染 ----------
  (function () {
    var SHORTCUTS = {{BROWSER_SHORTCUTS_JSON}};

    // 图标集。配置里只写图标名（icon = "mail"），具体路径在这里维护。
    var ICONS = {
      download: '<path d="M12 16 6 10h4V4h4v6h4zM5 18h14v2H5z"/>',
      mail: '<path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/>',
      calendar: '<path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14zM5 8V6h14v2z"/>',
      doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-1 7V3.5L18.5 9z"/>',
      cloud: '<path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z"/>',
      grid: '<path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/>',
      approve: '<path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 3 5 5h-3v4h-4v-4H7z"/>',
      shield: '<path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5z"/>',
      settings: '<path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3-2.1-.36a7 7 0 0 0-.5-1.2l1.24-1.75-1.41-1.41-1.75 1.24a7 7 0 0 0-1.2-.5L15.06 4h-2l-.36 2.1a7 7 0 0 0-1.2.5L9.75 5.36 8.34 6.77l1.24 1.75a7 7 0 0 0-.5 1.2L7 10.06v2l2.1.36a7 7 0 0 0 .5 1.2l-1.24 1.75 1.41 1.41 1.75-1.24a7 7 0 0 0 1.2.5L13.06 18h2l.36-2.1a7 7 0 0 0 1.2-.5l1.75 1.24 1.41-1.41-1.24-1.75a7 7 0 0 0 .5-1.2L21 12z"/>',
      folder: '<path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z"/>',
      chart: '<path d="M5 9h3v11H5zm5.5-5h3v16h-3zM16 13h3v7h-3z"/>'
    };

    var box = document.getElementById('shortcuts');
    SHORTCUTS.forEach(function (s) {
      var el = document.createElement('a');
      el.className = 'shortcut'
        + (s.highlight ? ' primary' : '')
        + (s.dashed || s.icon === 'add' ? ' add-shortcut' : '');
      if (s.link) {
        el.href = s.link;
      } else {
        el.href = 'javascript:void(0)';
        el.addEventListener('click', function (e) { e.preventDefault(); });
      }

      var tile = document.createElement('div');
      tile.className = 'tile';

      if (s.icon === 'add') {
        tile.textContent = '+';
      } else if (ICONS[s.icon]) {
        if (!s.highlight) {
          // 装饰磁贴用主色的浅色底（8 位 hex 的末两位是透明度）
          tile.style.background = s.color ? s.color + '1f' : '#f1f3f4';
        }
        tile.innerHTML = '<svg viewBox="0 0 24 24" fill="'
          + (s.highlight ? 'currentColor' : (s.color || '#5f6368'))
          + '">' + ICONS[s.icon] + '</svg>';
      } else if (s.icon) {
        // 配置里写了未知图标名，用文字兜底而不是留空
        tile.textContent = s.icon.charAt(0);
      }

      var label = document.createElement('div');
      label.className = 'label';
      label.textContent = s.name;

      el.appendChild(tile);
      el.appendChild(label);
      box.appendChild(el);
    });
  })();

  // 在搜索框里回车即跳转到搜索结果页，模拟真实的浏览器搜索行为。
  document.getElementById('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = document.getElementById('q').value.trim();
    if (!q) { return; }
    location.href = 'search.html?q=' + encodeURIComponent(q);
  });
</script>

</body>
</html>
