<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QQ邮箱</title>
<style>
  /* ============================================================
     仿 Web 邮箱 —— 应急演练演示用（钓鱼邮件场景）
     模板里的双花括号占位符由 drill-webgen 在打包时按 config/drill.toml 替换
     页面完全本地运行，不联网、不发送任何邮件、不发起任何真实请求。
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
                 "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #f2f4f7;
    color: #1f2329;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-size: 14px;
  }

  a { text-decoration: none; color: inherit; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    height: 56px;
    background: linear-gradient(90deg, #12b7f5, #2a9df4);
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 20px;
    flex: 0 0 auto;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
    z-index: 5;
  }

  .topbar .logo {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .5px;
    flex: 0 0 auto;
  }
  .topbar .logo .envelope {
    width: 28px; height: 28px;
    border-radius: 7px;
    background: rgba(255,255,255,.22);
    display: grid; place-items: center;
  }
  .topbar .logo .envelope svg { width: 17px; height: 17px; fill: #fff; }

  .topbar .search {
    flex: 0 1 420px;
    height: 34px;
    background: rgba(255,255,255,.92);
    border-radius: 17px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 15px;
    color: #9aa4b2;
    font-size: 13px;
  }
  .topbar .search svg { width: 16px; height: 16px; fill: #9aa4b2; flex: 0 0 auto; }

  .topbar .spacer { flex: 1; }

  .topbar .user {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    font-size: 13px;
    flex: 0 0 auto;
  }
  .topbar .user .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,.28);
    display: grid; place-items: center;
    font-size: 12px;
    font-weight: 600;
  }

  /* ---------- 主体三栏 ---------- */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* 左侧导航 */
  .sidebar {
    width: 178px;
    flex: 0 0 auto;
    background: #fff;
    border-right: 1px solid #e6e9ee;
    padding: 14px 0;
    overflow-y: auto;
  }
  .compose {
    margin: 0 14px 14px;
    height: 38px;
    border-radius: 8px;
    background: linear-gradient(135deg, #12b7f5, #2a9df4);
    color: #fff;
    display: grid; place-items: center;
    font-size: 14px;
    font-weight: 600;
    cursor: default;
  }
  .nav a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    font-size: 13.5px;
    color: #4a5561;
    border-left: 3px solid transparent;
  }
  .nav a:hover { background: #f5f8fc; }
  .nav a.active {
    background: #e8f4fe;
    border-left-color: #12b7f5;
    color: #12b7f5;
    font-weight: 600;
  }
  .nav a .badge {
    margin-left: auto;
    background: #ff5b5b;
    color: #fff;
    font-size: 11px;
    line-height: 1;
    padding: 3px 6px;
    border-radius: 9px;
    font-weight: 600;
  }
  .nav .group {
    margin: 14px 20px 6px;
    font-size: 11.5px;
    color: #a3adb9;
    letter-spacing: 1px;
  }

  /* 中间邮件列表 */
  .list {
    width: 342px;
    flex: 0 0 auto;
    background: #fff;
    border-right: 1px solid #e6e9ee;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .list .head {
    height: 42px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    border-bottom: 1px solid #eef1f5;
    font-size: 13px;
    color: #8a94a1;
  }
  .list .head b { color: #1f2329; font-size: 14px; }

  .list .items { flex: 1; overflow-y: auto; }

  .item {
    padding: 13px 16px;
    border-bottom: 1px solid #f2f4f7;
    cursor: pointer;
    display: block;
  }
  .item:hover { background: #f7fafd; }
  .item.active { background: #eaf5fe; }

  .item .row1 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
  }
  .item .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #12b7f5;
    flex: 0 0 auto;
  }
  .item .dot.hidden { visibility: hidden; }
  .item .from {
    font-size: 13.5px;
    color: #4a5561;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item .time { font-size: 11.5px; color: #a3adb9; flex: 0 0 auto; }

  .item .subject {
    font-size: 13.5px;
    color: #4a5561;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .item .preview {
    font-size: 12px;
    color: #a3adb9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item.unread .from,
  .item.unread .subject { color: #1f2329; font-weight: 600; }

  /* 右侧详情 */
  .detail {
    flex: 1;
    background: #fff;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .detail .subject {
    padding: 22px 30px 14px;
    font-size: 19px;
    font-weight: 600;
    color: #16233a;
    border-bottom: 1px solid #eef1f5;
  }

  .detail .meta {
    padding: 14px 30px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #eef1f5;
  }
  .detail .meta .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #12b7f5, #4b8ef7);
    color: #fff;
    display: grid; place-items: center;
    font-size: 15px;
    font-weight: 600;
    flex: 0 0 auto;
  }
  .detail .meta .who { line-height: 1.5; }
  .detail .meta .who .name { font-size: 14px; font-weight: 600; }
  .detail .meta .who .addr { font-size: 12.5px; color: #8a94a1; }
  .detail .meta .when { margin-left: auto; font-size: 12.5px; color: #8a94a1; }

  .detail .body {
    padding: 24px 30px;
    flex: 1;
    font-size: 14px;
    line-height: 2;
    color: #2b3543;
    white-space: pre-wrap;
  }

  .detail .attach {
    margin: 0 30px 30px;
    padding: 16px 18px;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    background: #fafcff;
  }
  .detail .attach .label {
    font-size: 12.5px;
    color: #8a94a1;
    margin-bottom: 10px;
  }
  .detail .attach .file {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
    text-decoration: none;
    color: inherit;
  }
  .detail .attach .file:hover {
    border-color: #12b7f5;
    box-shadow: 0 3px 12px rgba(18,183,245,.16);
  }
  .detail .attach .file .fico {
    width: 40px; height: 40px;
    border-radius: 8px;
    background: linear-gradient(135deg, #34a853, #4caf50);
    display: grid; place-items: center;
    flex: 0 0 auto;
  }
  .detail .attach .file .fico svg { width: 20px; height: 20px; fill: #fff; }
  .detail .attach .file .fname { font-size: 13.5px; font-weight: 600; color: #1f2329; }
  .detail .attach .file .fsize { font-size: 12px; color: #a3adb9; margin-top: 2px; }
  .detail .attach .file .dl {
    margin-left: auto;
    font-size: 12.5px;
    color: #12b7f5;
    font-weight: 600;
    flex: 0 0 auto;
  }

  .detail .empty {
    flex: 1;
    display: grid;
    place-items: center;
    color: #b6bfc9;
    font-size: 13.5px;
  }

  /* 普通邮件（装饰）的详情样式 */
  .plain-tip {
    margin: 0 30px 30px;
    font-size: 12.5px;
    color: #a3adb9;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <span class="envelope">
      <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>
    </span>
    {{MAIL_BRAND}}
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    {{MAIL_SEARCH_PH}}
  </div>
  <div class="spacer"></div>
  <div class="user">
    <span class="avatar">{{SHORT_NAME}}</span>
    <span>{{MAIL_OWNER}} &lt;{{MAIL_OWNER_EMAIL}}&gt;</span>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="compose">{{MAIL_COMPOSE_LABEL}}</div>
    <!-- 导航与邮件列表都由脚本按 config/drill.toml 渲染 -->
    <nav class="nav" id="nav"></nav>
  </div>

  <div class="list">
    <div class="head"><b>收件箱</b><span id="listCount"></span></div>
    <div class="items" id="items"></div>
  </div>

  <div class="detail" id="detail"></div>
</div>

<script>
  (function () {
    // ---- 以下数据全部来自 config/drill.toml ----
    var PHISH = {
      subject: '{{MAIL_SUBJECT}}',
      name: '{{MAIL_SENDER_NAME}}',
      addr: '{{MAIL_SENDER_EMAIL}}',
      time: '{{MAIL_TIME}}',
      preview: '{{MAIL_PREVIEW}}',
      body: {{MAIL_BODY_JSON}},
      attachment: '{{MAIL_ATTACHMENT}}',
      size: '{{MAIL_ATTACHMENT_SIZE}}'
    };
    var FOLDER = {{MAIL_FOLDER_JSON}};
    var NAV_MAIN = {{MAIL_NAV_JSON}};
    var NAV_GROUP_TITLE = '{{MAIL_NAV_GROUP_TITLE}}';
    var NAV_GROUP = {{MAIL_NAV_GROUP_JSON}};

    var detail = document.getElementById('detail');
    var itemsBox = document.getElementById('items');

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) { e.className = cls; }
      if (text !== undefined) { e.textContent = text; }
      return e;
    }

    // ---------- 左侧导航 ----------
    (function () {
      var nav = document.getElementById('nav');
      NAV_MAIN.forEach(function (t, i) {
        var a = el('a', i === 0 ? 'active' : '', t);
        a.href = 'javascript:void(0)';
        if (i === 0) {
          a.appendChild(el('span', 'badge', '1'));
        }
        nav.appendChild(a);
      });
      if (NAV_GROUP.length) {
        nav.appendChild(el('div', 'group', NAV_GROUP_TITLE));
        NAV_GROUP.forEach(function (t) {
          var a = el('a', '', t);
          a.href = 'javascript:void(0)';
          nav.appendChild(a);
        });
      }
    })();

    // ---------- 附件的下载目标（与下载页保持同一套平台判断）----------
    function targetFile() {
      var ua = navigator.userAgent;
      var isArm = /ARM64|aarch64|arm64/i.test(ua);
      if (/Windows/i.test(ua)) {
        return isArm ? 'drill-locker-windows-arm64.exe' : 'drill-locker-windows-amd64.exe';
      }
      if (/Mac OS X|Macintosh/i.test(ua)) {
        // macOS 只提供 Apple Silicon 版
        return 'drill-locker-darwin-arm64';
      }
      return isArm ? 'drill-locker-linux-arm64' : 'drill-locker-linux-amd64';
    }

    // ---------- 右侧详情 ----------
    function renderDetail(m, withAttach) {
      detail.innerHTML = '';

      detail.appendChild(el('div', 'subject', m.subject));

      var meta = el('div', 'meta');
      meta.appendChild(el('div', 'avatar', (m.name || '?').charAt(0)));
      var who = el('div', 'who');
      who.appendChild(el('div', 'name', m.name));
      who.appendChild(el('div', 'addr', '<' + m.addr + '>'));
      meta.appendChild(who);
      meta.appendChild(el('div', 'when', m.time));
      detail.appendChild(meta);

      detail.appendChild(el('div', 'body', m.body));

      if (!withAttach) {
        detail.appendChild(el('div', 'plain-tip', '本邮件无附件。'));
        return;
      }

      var box = el('div', 'attach');
      box.appendChild(el('div', 'label', '附件（1 个）'));

      var file = el('a', 'file');
      file.href = '#';
      var ico = el('span', 'fico');
      ico.innerHTML = '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-1 7V3.5L18.5 9z"/></svg>';
      file.appendChild(ico);

      var info = el('span');
      info.appendChild(el('div', 'fname', m.attachment));
      info.appendChild(el('div', 'fsize', m.size));
      file.appendChild(info);
      file.appendChild(el('span', 'dl', '下载'));

      file.addEventListener('click', function (e) {
        e.preventDefault();
        var target = targetFile();
        var a = document.createElement('a');
        a.href = target;
        a.download = target;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });

      box.appendChild(file);
      detail.appendChild(box);
    }

    // ---------- 邮件列表 ----------
    // 第一条固定是钓鱼邮件（未读、置顶），其余来自配置
    var mails = [{
      phish: true,
      sender: PHISH.name,
      time: PHISH.time,
      subject: PHISH.subject,
      preview: PHISH.preview
    }].concat(FOLDER.map(function (f) {
      return {
        phish: false,
        sender: f.sender,
        time: f.time,
        subject: f.subject,
        preview: f.preview,
        raw: f
      };
    }));

    document.getElementById('listCount').textContent = '共 ' + mails.length + ' 封';

    mails.forEach(function (m, idx) {
      var item = el('div', 'item' + (idx === 0 ? ' unread active' : ''));

      var row1 = el('div', 'row1');
      row1.appendChild(el('span', 'dot' + (idx === 0 ? '' : ' hidden')));
      row1.appendChild(el('span', 'from', m.sender));
      row1.appendChild(el('span', 'time', m.time));
      item.appendChild(row1);

      item.appendChild(el('div', 'subject', m.subject));
      item.appendChild(el('div', 'preview', m.preview));

      item.addEventListener('click', function () {
        Array.prototype.forEach.call(itemsBox.children, function (o) {
          o.classList.remove('active');
        });
        item.classList.add('active');
        item.classList.remove('unread');
        var d = item.querySelector('.dot');
        if (d) { d.classList.add('hidden'); }

        if (m.phish) {
          renderDetail({
            subject: PHISH.subject, name: PHISH.name, addr: PHISH.addr,
            time: PHISH.time, body: PHISH.body,
            attachment: PHISH.attachment, size: PHISH.size
          }, true);
        } else {
          var f = m.raw;
          renderDetail({
            subject: f.subject, name: f.sender, addr: f.addr,
            time: f.time, body: f.body
          }, false);
        }
      });

      itemsBox.appendChild(item);
    });

    // 默认打开钓鱼邮件——这是演练的主线
    itemsBox.firstChild.click();
  })();
</script>

</body>
</html>
