<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜索结果</title>
<style>
  /* ============================================================
     仿搜索引擎结果页 —— 应急演练演示用
     模板里的双花括号占位符由 drill-webgen 在打包时按 config/drill.toml 替换
     页面完全本地运行，不联网、不发起任何真实请求。
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
                 "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #fff;
    color: #202124;
    font-size: 14px;
  }

  a { text-decoration: none; }

  /* ---------- 顶部 ---------- */
  .header {
    border-bottom: 1px solid #ebebeb;
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 10;
  }

  .header-row {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 22px 28px 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 9px;
    flex: 0 0 auto;
  }
  .logo .ring {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: conic-gradient(#ea4335 0deg 130deg, #fbbc05 130deg 220deg, #34a853 220deg 360deg);
    display: grid;
    place-items: center;
    flex: 0 0 auto;
  }
  .logo .ring i {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    display: grid; place-items: center;
    font-style: normal;
    font-size: 9px;
    font-weight: 700;
    color: #1a73e8;
  }
  .logo .word {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .5px;
    color: #1a73e8;
  }

  .searchbar {
    flex: 1;
    max-width: 700px;
    height: 44px;
    border: 1px solid #dfe1e5;
    border-radius: 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: #fff;
    box-shadow: 0 1px 6px rgba(32,33,36,.12);
  }
  .searchbar:hover { box-shadow: 0 1px 10px rgba(32,33,36,.22); }
  .searchbar input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    color: #202124;
    background: transparent;
    font-family: inherit;
  }
  .searchbar svg { width: 19px; height: 19px; fill: #9aa0a6; flex: 0 0 auto; }

  .account {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 0 0 auto;
  }
  .account .grid-icon {
    width: 26px; height: 26px;
    fill: #5f6368;
  }
  .account .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5b8def, #7b5bef);
    color: #fff;
    display: grid; place-items: center;
    font-size: 12px;
    font-weight: 600;
  }

  .tabs {
    display: flex;
    gap: 26px;
    padding: 14px 0 0 178px;
    font-size: 13.5px;
    color: #5f6368;
  }
  .tabs a { color: #5f6368; padding-bottom: 11px; border-bottom: 3px solid transparent; }
  .tabs a.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 500; }

  /* ---------- 结果区 ---------- */
  .content {
    margin-left: 178px;
    padding: 16px 28px 60px 0;
    max-width: 660px;
  }

  .stats {
    color: #70757a;
    font-size: 12.5px;
    margin-bottom: 22px;
  }

  .result { margin-bottom: 30px; }

  .crumb {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
  }
  .crumb .fav {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #f1f3f4;
    display: grid; place-items: center;
    flex: 0 0 auto;
    font-size: 11px;
    color: #5f6368;
    font-weight: 700;
  }
  .crumb .meta { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
  .crumb .site { font-size: 13px; color: #202124; }
  .crumb .url {
    font-size: 12px;
    color: #4d5156;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result .title {
    display: block;
    font-size: 19px;
    line-height: 1.35;
    color: #1a0dab;
    margin-bottom: 5px;
  }
  .result .title:hover { text-decoration: underline; }

  .result .snippet {
    font-size: 13.5px;
    line-height: 1.62;
    color: #4d5156;
  }

  .ad-label {
    font-size: 13px;
    font-weight: 700;
    color: #202124;
    margin-bottom: 5px;
  }

  .badge {
    display: inline-block;
    background: #e8f0fe;
    color: #1967d2;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
    font-weight: 500;
  }

  .official-tag {
    display: inline-block;
    background: #e6f4ea;
    color: #137333;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
    font-weight: 500;
  }

  .related { margin-top: 34px; }
  .related h3 { font-size: 16px; font-weight: 500; margin-bottom: 14px; }
  .related ul { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; }
  .related a { color: #1a0dab; font-size: 14px; }
  .related a:hover { text-decoration: underline; }

  .pager {
    margin-top: 38px;
    text-align: center;
    color: #1a0dab;
    font-size: 15px;
    letter-spacing: 6px;
  }
  .pager b { color: #202124; }

  .drill-notice {
    margin: 46px 178px 0 178px;
    padding: 13px 18px;
    background: #fff8e1;
    border: 1px solid #ffe08a;
    border-radius: 10px;
    font-size: 12.5px;
    line-height: 1.8;
    color: #7a5c00;
    max-width: 820px;
  }
  .drill-notice b { color: #5d4600; }

  @media (max-width: 900px) {
    .tabs { padding-left: 24px; }
    .content { margin-left: 24px; }
    .drill-notice { margin: 40px 24px 0; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <a class="logo" href="index.html">
      <span class="ring"><i>{{SHORT_NAME}}</i></span>
      <span class="word">{{SEARCH_BRAND}}</span>
    </a>

    <form class="searchbar" id="searchForm" autocomplete="off">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input type="text" id="q" spellcheck="false">
      <svg viewBox="0 0 24 24" style="cursor:pointer" id="clearBtn"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </form>

    <div class="account">
      <svg class="grid-icon" viewBox="0 0 24 24"><path d="M6 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4zM6 14a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4zM6 20a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
      <span class="avatar">{{SHORT_NAME}}</span>
    </div>
  </div>

  <!-- 栏目与结果都由脚本按 config/drill.toml 渲染 -->
  <div class="tabs" id="tabs"></div>
</div>

<div class="content">
  <div class="stats" id="stats">{{SEARCH_STATS}}</div>

  <!-- 陷阱条目与装饰结果都由脚本按 config/drill.toml 渲染 -->
  <div id="results"></div>

  <div class="related">
    <h3>相关搜索</h3>
    <ul id="related"></ul>
  </div>

  <div class="pager" id="pager"></div>
</div>

<div class="drill-notice">
  <b>【应急演练声明】</b>
  本页面为 {{ORG}} 网络安全应急演练（编号 {{DRILL_CODE}}）的演示素材，是**仿冒的搜索结果页**，
  页面不联网、不会发起任何真实搜索或跳转。页面上所有「广告」结果均为演练道具。
  所下载的程序不具备任何真实加密、破坏或传播能力，演练结束后可一键完整恢复。
</div>

<script>
  (function () {
    var TABS = {{SEARCH_TABS_JSON}};
    var PAGER = {{SEARCH_PAGER_JSON}};
    var RELATED = {{SEARCH_RELATED_JSON}};
    var DECOR = {{SEARCH_RESULTS_JSON}};
    var DEFAULT_KEYWORD = '{{SEARCH_DEFAULT_KEYWORD}}';
    var FAKE_DOMAIN = '{{FAKE_DOMAIN}}';
    var DOWNLOAD_NAME = '{{DOWNLOAD_NAME}}';

    var params = new URLSearchParams(location.search);
    var q = (params.get('q') || '').trim() || DEFAULT_KEYWORD;

    // 回填搜索框
    document.getElementById('q').value = q;
    document.title = q + ' - 搜索';

    // ---------- 栏目 ----------
    var tabsBox = document.getElementById('tabs');
    TABS.forEach(function (t, i) {
      var a = document.createElement('a');
      a.textContent = t;
      a.href = 'javascript:void(0)';
      if (i === 0) { a.className = 'active'; }
      tabsBox.appendChild(a);
    });

    // ---------- 相关搜索 ----------
    var relBox = document.getElementById('related');
    RELATED.forEach(function (r) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = 'javascript:void(0)';
      a.textContent = r;
      li.appendChild(a);
      relBox.appendChild(li);
    });

    // ---------- 分页 ----------
    var pagerBox = document.getElementById('pager');
    PAGER.forEach(function (p, i) {
      if (i) { pagerBox.appendChild(document.createTextNode(' ')); }
      if (i === 0) {
        var b = document.createElement('b');
        b.textContent = p;
        pagerBox.appendChild(b);
      } else {
        pagerBox.appendChild(document.createTextNode(p));
      }
    });

    // ---------- 结果条目 ----------
    function buildResult(r, adLabel) {
      var wrap = document.createElement('div');
      wrap.className = 'result';

      if (adLabel) {
        var ad = document.createElement('div');
        ad.className = 'ad-label';
        ad.textContent = adLabel;
        wrap.appendChild(ad);
      }

      var crumb = document.createElement('div');
      crumb.className = 'crumb';
      var fav = document.createElement('span');
      fav.className = 'fav';
      fav.textContent = r.favicon || '';
      var meta = document.createElement('span');
      meta.className = 'meta';
      var site = document.createElement('span');
      site.className = 'site';
      site.textContent = r.site;
      var url = document.createElement('span');
      url.className = 'url';
      url.textContent = r.url;
      meta.appendChild(site);
      meta.appendChild(url);
      crumb.appendChild(fav);
      crumb.appendChild(meta);
      wrap.appendChild(crumb);

      var title = document.createElement('a');
      title.className = 'title';
      title.textContent = r.title;
      title.href = r.href || 'javascript:void(0)';
      if (!r.href) { title.addEventListener('click', function (e) { e.preventDefault(); }); }
      wrap.appendChild(title);

      var snip = document.createElement('p');
      snip.className = 'snippet';
      snip.textContent = r.snippet;
      wrap.appendChild(snip);

      return wrap;
    }

    // 置顶的「广告」陷阱条目：按关键词动态生成。
    // 搜浏览器类关键词时伪装成「浏览器官方下载」，这是真实攻击里最常见的手法。
    var isBrowser = /chrome|chromium|浏览器|browser|edge|firefox|火狐|谷歌/i.test(q);
    var trap = {
      favicon: '下',
      site: FAKE_DOMAIN,
      url: 'https://' + FAKE_DOMAIN + ' › download',
      href: isBrowser ? 'download.html?as=chrome' : 'download.html',
      title: '',
      snippet: ''
    };

    if (isBrowser) {
      trap.favicon = 'C';
      // 关键词里已经含「下载」时不要重复拼接
      trap.title = /下载|download/i.test(q)
        ? q + ' - 极速安全稳定版 官方正版'
        : q + ' 官方下载 - 极速安全稳定版';
      trap.snippet = '官方正版下载，无捆绑无广告，安装包体积小巧，兼容主流操作系统。'
                   + '已通过多项安全认证，支持一键静默安装，立即下载体验。';
    } else {
      trap.title = DOWNLOAD_NAME + ' 官方下载 - 官方正版免费安装';
      trap.snippet = '「' + DOWNLOAD_NAME + '」官方下载入口。体积小、运行稳定，支持一键清理、'
                   + '开机加速与驱动检测，已服务上万家企业用户。官方直链，极速下载。';
    }

    var box = document.getElementById('results');
    box.appendChild(buildResult(trap, '广告'));
    DECOR.forEach(function (r) { box.appendChild(buildResult(r, '')); });

    // ---------- 搜索框 ----------
    document.getElementById('searchForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var nq = document.getElementById('q').value.trim();
      if (nq) { location.href = 'search.html?q=' + encodeURIComponent(nq); }
    });

    document.getElementById('clearBtn').addEventListener('click', function () {
      document.getElementById('q').value = '';
      document.getElementById('q').focus();
    });
  })();
</script>

</body>
</html>
